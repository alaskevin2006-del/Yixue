services:
  app:
    environment:
      YIXUE_OPERATIONS_STATUS_PATH: /data/operations/status.json
  test:
    image: ${YIXUE_TEST_IMAGE:-yixue-app:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      YIXUE_HOST: 0.0.0.0
      YIXUE_PORT: 3000
      YIXUE_DB_PATH: /data/yixue.sqlite
      YIXUE_UPLOADS_DIR: /data/uploads
      YIXUE_BASE_PATH: /test
      YIXUE_COOKIE_NAME: yixue_test_session
      YIXUE_COOKIE_PATH: /test
      YIXUE_ENVIRONMENT: test
      YIXUE_OPERATIONS_STATUS_PATH: /data/operations/status.json
    volumes:
      - ./deploy-data/test:/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
