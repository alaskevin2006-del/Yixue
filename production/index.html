<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逸学 Yixue</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./vendor/katex/katex.min.css"><link rel="stylesheet" href="./client/product.css"></head>
<body>
  <section class="auth-shell" data-auth>
    <a class="brand" href="/">Yixue</a><h1>继续你的学习</h1><p>用管理员为你开通的账户登录。</p>
    <form data-login class="stack-form"><label>用户名<input name="username" autocomplete="username" required maxlength="64"></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><p data-login-error role="alert" class="form-error"></p><button class="r1-button primary" type="submit">登录</button></form>
    <p class="local-note" data-boot-status role="status">正在连接…</p>
  </section>
  <div data-app hidden>
    <header class="topbar"><a class="brand" href="#/home" data-view-link="home">Yixue</a><nav class="main-nav" aria-label="主导航"><button class="nav-pill active" data-view-link="home">首页</button><button class="nav-pill" data-view-link="library">资料库</button><button class="nav-pill" data-view-link="subjects">学科空间</button></nav><button class="profile-btn" data-account aria-label="账户">我</button></header>
    <div class="global-status" data-global-status role="alert" hidden><span></span><button class="text-link" data-dismiss-error aria-label="关闭提示">×</button></div>
    <main>
      <section class="view active" id="home-view" aria-label="日程"></section>
      <section class="view" id="planner-view" aria-label="规划助手"></section>
      <section class="view" id="library-view" aria-labelledby="library-title"><div class="library-shell"><div class="library-top"><h1 id="library-title">资料库</h1><button class="r1-button primary submission-entry" data-library-tab="submission">我要投稿</button><label class="library-search"><span aria-hidden="true">⌕</span><input data-library-search type="search" placeholder="搜索课程或资料…" aria-label="搜索课程或资料"></label></div><nav class="library-tabs" aria-label="资料库页面"><button class="active" data-library-tab="public">公共资料</button><button data-library-tab="private">私人资料</button></nav><div data-library-content></div></div></section>
      <section class="view" id="subjects-view" aria-label="学科空间">
        <section data-subject-index><div class="r1-index-heading"><h1>学科空间</h1><button class="r1-button" data-add-subject>添加学科</button></div><div class="r1-subject-tools"><input type="search" data-subject-search aria-label="搜索学科" placeholder="搜索学科…"></div><div class="r1-subject-list" data-subject-list></div></section>
        <section data-subject-workspace hidden><div class="r1-subject-heading"><button class="r1-subject-back" data-subject-home aria-label="返回学科空间">‹</button><h1 data-current-subject></h1><div class="toolbar-actions"><button class="r1-nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="conversation-navigation">☰ 对话</button></div></div><nav class="r1-tabs" aria-label="学科页面"><button class="active" data-subject-tab="learn">学习</button><button data-subject-tab="review">回顾</button><button data-subject-tab="files">资料</button></nav>
          <div class="r1-learning" data-workspace-shell><button class="r1-nav-scrim" data-nav-scrim aria-label="关闭对话列表" hidden></button><aside id="conversation-navigation" class="r1-conversation-nav" data-conversation-nav hidden><div class="r1-nav-heading"><strong>对话</strong><button class="text-link" data-nav-close aria-label="关闭对话列表">×</button></div><button class="r1-button r1-new-chat" data-new-conversation>+ 新对话</button><div data-conversation-list></div></aside>
            <div class="r1-task-region"><section data-review-panel hidden></section><section data-files-panel hidden></section>
              <section class="r1-current-workspace" data-chat-panel><header class="r1-conversation-heading"><div><h2 data-current-conversation>选择或新建对话</h2><p data-message-target class="local-note"></p></div><div class="r1-chat-actions"><button class="text-link" data-review-current hidden>整理学习记录</button><button class="text-link" data-delete-conversation disabled>删除</button></div></header><div class="reference-strip" data-references></div><div class="r1-messages" data-messages aria-live="polite"></div><p data-run-status class="local-note" role="status"></p><form class="r1-composer" data-message-form><label class="sr-only" for="message-input">学习输入</label><textarea id="message-input" data-message-input rows="3" placeholder="写下当前的问题…" disabled required></textarea><button class="r1-button" data-send-message type="submit" disabled>发送</button></form><p data-save-status class="local-note" role="status"></p></section>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>
  <dialog data-modal><header class="modal-head"><h2 data-modal-title></h2><button class="text-link" data-modal-close aria-label="关闭">×</button></header><div data-modal-content></div></dialog>
  <dialog class="state-planner-dialog" data-state-dialog><header class="state-planner-head"><div><h2>学科现状</h2><p class="local-note">自然语言记录当前仍会影响行动判断的信息。AI 整理后由你决定是否采用。</p></div><button class="text-link" data-state-close aria-label="关闭现状">×</button></header><div class="state-planner-body"><section class="state-planner-state"><div class="state-subject-list" data-state-subjects></div></section><section class="state-planner-chat" data-state-editor></section></div></dialog>
  <script type="module" src="./app.js"></script>
</body></html>
